[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-fusion-studio"
version = "0.1.0"
description = "A modular, multi-engine OCR pipeline: Qwen2.5-VL + Unlimited-OCR with result comparison and fusion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ammaar Bakshi" }]
keywords = ["ocr", "vlm", "qwen", "unlimited-ocr", "document-parsing", "ollama"]

# Core framework dependencies only. The framework (ocr_fusion) is importable
# without Streamlit so other projects can reuse the pipeline headlessly.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pillow>=10.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
tesseract = ["pytesseract>=0.3.10"]
transformers = ["torch>=2.1", "transformers>=4.45", "einops", "addict", "easydict"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ocr-fusion = "ocr_fusion.cli:main"

[project.urls]
Repository = "https://github.com/AmmaarBakshi/OCR-FS"

[tool.setuptools.packages.find]
include = ["ocr_fusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that need a live provider runtime (deselect with -m 'not integration')",
    "slow: tests that run real model inference",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
